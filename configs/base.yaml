# Cấu hình gốc. Các file trong configs/exp/ chỉ ghi đè phần khác biệt.
# Số liệu VRAM/tốc độ: scripts/benchmark.py trên RTX 5060 Ti 16GB (outputs/benchmark/).
# Số liệu dữ liệu: SynthRAD2023 Task1 train (outputs/dataset_meta/).

seed: 42
output_dir: outputs

data:
  raw_root: data/raw/Task1_train
  processed_dir: data/processed
  regions: [brain, pelvis]          # chung 1 model
  split:
    file: configs/splits/split_seed42.json
    ratios: {train: 0.7, val: 0.1, test: 0.2}   # 252 / 36 / 72 bệnh nhân
    stratify_by: [region, center]
    seed: 42
  preprocess:
    bbox_margin: [2, 8, 8]          # lề (z, y, x) khi cắt theo bbox của mask
    workers: 8
  context_slices: 1                 # 2.5D: lát z +- 1 -> 3 kênh MR
  context_mm: 2.0                   # stride = round(2.0 / spacing_z): brain 2, pelvis 1
  patch_size: 256
  min_foreground: 0.1               # bỏ patch có < 10% điểm trong mask
  ct_clip: [-1024, 3000]            # HU -> [-1, 1]
  mr_percentiles: [0.5, 99.5]       # tính trong mask, theo từng volume -> [-1, 1]
  pad_value: -1.0                   # MR/CT sau chuẩn hóa; mask pad 0
  hflip: 0.5
  val_slices_per_patient: 5
  num_workers: 4
  pin_memory: true
  persistent_workers: true

model:                              # UNet 2.5D cổ điển (src/models/unet2d.py), 31.04M tham số
  in_channels: 3                    # 2*context_slices+1 lát MR
  out_channels: 1
  base_channels: 64                 # 64 -> 128 -> 256 -> 512 -> 1024 (đáy)
  depth: 4                          # số lần giảm kích thước, patch phải chia hết cho 2^depth
  norm: batch                       # batch | instance | group
  block: conv                       # conv: 2 x [Conv-Norm-ReLU] | res: ResBlock cùng số conv
  attention_gates: false            # true: attention gate trên mỗi skip (Attention U-Net)
  bottleneck_attention: false       # true: 1 khối self-attention ở bottleneck (16x16 với patch 256)
  attention_head_channels: 64       # 1024 kênh / 64 = 16 head

method:
  name: regression
  loss: l1                          # l1 | l2

train:
  precision: bf16
  batch_size: 8                     # như bản cũ; UNet2D ~2.6GB, 80 img/s (scripts/benchmark.py)
  grad_accum: 4                     # batch hiệu dụng 32
  total_images: 320000              # -> 10000 optimizer step, ~8 epoch, ~1.1h compute (bản cũ 400k, ~7h)
  optimizer:
    name: adamw
    lr: 2.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.0
  lr_schedule:
    name: cosine
    warmup_steps: 250               # optimizer step
    min_lr: 1.0e-6
  grad_clip: 1.0
  ema: null                         # không dùng EMA
  cudnn_benchmark: true
  log_every: 25                     # optimizer step
  val_every: 1000
  save_every: 1000
  val_fast_nfe: [1]                 # regression chỉ có NFE 1
  val_full:
    top_k: 2                        # chạy val toàn volume cho 2 checkpoint tốt nhất
    nfe: 1

inference:
  precision: bf16
  roi_size: 256
  overlap: 0.25
  blend_mode: gaussian
  pad_value: -1.0
  sw_batch_size: 16
  nfe: [1]

logging:
  tqdm: true
  wandb:
    enabled: true
    project: mri2ct
    entity: storknguyen-286-university-system-of-georgia
    mode: online                    # online | offline (sync sau bằng `wandb sync`) | disabled
    tags: []

eval:
  metrics: [mae, psnr, ssim, mae_air, mae_fat, mae_soft, mae_marrow, mae_cortical]
  in_mask: true
  hu_range: [-1024, 3000]
  report_without_special: true      # báo cáo thêm khi bỏ các ca có ghi chú
