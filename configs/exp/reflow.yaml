# Conditional reflow (2-rectified flow) theo region (brain/pelvis).
# Teacher: flow matching 1-RF; cặp (noise seed 1, x̂1 = teacher Euler 2 bước) trên tập train,
# sinh bằng scripts/generate_reflow.py. Student khởi tạo từ teacher, thêm embedding region (khởi tạo 0).
# Ngân sách và siêu tham số giống các method khác.
run_name: reflow
method:
  name: reflow
  fix_background: true
model:
  in_channels: 4       # 1 (x_t) + 3 lát MR
  num_classes: 2       # region: brain = 0, pelvis = 1
data:
  reflow:
    file: reflow_nfe2  # <processed_dir>/<region>/<id>/reflow_nfe2.npy
    noise_seed: 1      # phải trùng --seed khi sinh cặp
train:
  init_from: outputs/runs/flow_matching_20261018-094349/best.pt
  val_fast_nfe: [1, 2]
  val_full:
    nfe: 1
