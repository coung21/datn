# UNet 2.5D + GroupNorm + attention gate + AdaGN theo vùng (não / chậu), kiểu ADM.
# So với unet2d_gn_ag (MAE test 69.26) và unet2d_gn_ag_rfilm (69.29): nhãn vùng -> embedding dùng chung (MLP như time
# embedding của ADM); GN thứ 2 mỗi khối conv thành GN(h) * (1 + scale) + shift, (scale, shift) = Linear(SiLU(e))
# riêng mỗi khối, khởi tạo 0. Còn lại giữ nguyên base.yaml.
run_name: unet2d_gn_ag_radagn
model:
  norm: group
  attention_gates: true
  region_adagn: true
